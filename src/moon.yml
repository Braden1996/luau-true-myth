$schema: "../.moon/cache/schemas/project.json"

# Project `lib`: the library (src/), its WoW entry point (wow/), the build and test scripts (scripts/).
layer: "library"
tags: ["luau"]

taskOptions:
  shell: false
  runFromWorkspaceRoot: true

tasks:
  lune-types:
    description: "Write Lune's type definitions, which .luaurc's `@lune` alias points at"
    command: "lune"
    args: ["setup"]
    options:
      cache: false
  typecheck:
    description: "Everything type-checks under --!strict on Luau's new solver, together"
    command: "luau-lsp"
    args: [
      "analyze",
      "--platform=standard",
      "--flag:LuauSolverV2=true",
      "--base-luaurc=.luaurc",
      "src/",
      "wow/",
      "scripts/",
      "tests/spec/",
      "tests/harness.luau",
    ]
    deps: ["~:lune-types"]
    inputs: ["/src/**/*.luau", "/wow/**/*.luau", "/scripts/**/*.luau", "/tests/**/*.luau", "/.luaurc"]
  strict-header:
    description: "Every Luau file starts with --!strict (scripts/lint.luau), and every `:: any` cast has a SAFETY note"
    command: "lune"
    args: ["run", "scripts/lint"]
    inputs: ["/src/**/*.luau", "/wow/**/*.luau", "/scripts/**/*.luau", "/tests/**/*.luau"]
  lint:
    description: "selene (selene.toml)"
    command: "selene"
    args: ["src", "wow", "scripts", "tests"]
    inputs: ["/src/**/*.luau", "/wow/**/*.luau", "/scripts/**/*.luau", "/tests/**/*.luau", "/selene.toml", "/*.yml"]
  build:
    description: "Build dist/TrueMyth.lua, the Lua 5.1 bundle (darklua), and check it"
    command: "lune"
    args: ["run", "scripts/build"]
    options:
      cache: false
  build-fresh:
    description: "dist/TrueMyth.lua equals a fresh build, parses as Lua 5.1, and uses only Lua 5.1 globals"
    command: "lune"
    args: ["run", "scripts/build", "--", "--check"]
    options:
      cache: false
  fmt:
    description: "Format all Luau with StyLua"
    command: "stylua"
    args: ["src", "wow", "scripts", "tests"]
    options:
      cache: false
  fmt-check:
    description: "StyLua check of all Luau (run `moon run lib:fmt` to fix)"
    command: "stylua"
    args: ["--check", "src", "wow", "scripts", "tests"]
    inputs: ["/src/**/*.luau", "/wow/**/*.luau", "/scripts/**/*.luau", "/tests/**/*.luau", "/stylua.toml"]
  check:
    description: "Aggregator: every library check"
    deps: ["~:typecheck", "~:strict-header", "~:lint", "~:build-fresh", "~:fmt-check"]
