# Publishes a release when a `v*.*.*` tag is pushed on main. `verify` re-runs the full Sergeant gate from a cold
# start with read-only permissions; `publish` attaches `TrueMyth.lua`, a woof-native `luau-true-myth-<ver>.zip`
# (with `woof.toml` and `src/` at archive root, excluding `*.spec.luau`), and `SHA256SUMS`.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! grep -q "version = \"${TAG#v}\"" packages/true-myth/src/TrueMyth.luau; then
            echo "::error file=packages/true-myth/src/TrueMyth.luau::version is not ${TAG#v}"
            exit 1
          fi
          if ! grep -q "^version = \"${TAG#v}\"$" woof.toml; then
            echo "::error file=woof.toml::version is not ${TAG#v}"
            exit 1
          fi
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: false
      - name: install luajit and enable sealing
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends luajit
      - name: setup and install
        run: |
          mise exec -- lune setup
          mise exec -- sgt --no-daemon install --frozen
          mise exec -- bun install --cwd site --frozen-lockfile
      - name: gate
        run: |
          mise exec -- sgt --no-daemon doctor
          mise exec -- sgt --no-daemon check
          mise exec -- sgt --no-daemon test
          mise exec -- sgt --no-daemon run scripts-typecheck
          mise exec -- sgt --no-daemon run build-fresh
          mise exec -- sgt --no-daemon run bundle-specs
          mise exec -- sgt --no-daemon run fixtures
          mise exec -- sgt --no-daemon run site-check

  publish:
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" 'index($0, "## [" v "]") == 1 {on=1; next} /^## / && on {exit} on && !/^\[.*\]: http/' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "::error file=CHANGELOG.md::no section for ${TAG#v}"; exit 1; fi
          cat notes.md
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ver="${TAG#v}"
          zip_name="luau-true-myth-${ver}.zip"
          mkdir -p pkg/src
          cp packages/true-myth/src/*.luau pkg/src/
          rm -f pkg/src/*.spec.luau
          cp LICENSE README.md CHANGELOG.md pkg/
          cat > pkg/woof.toml <<EOF
          [package]
          name = "luau-true-myth"
          version = "${ver}"
          kind = "library"
          target = "luau"
          entry = "src/TrueMyth.luau"
          EOF
          (cd pkg && zip -qr "../${zip_name}" .)
          cp dist/TrueMyth.lua TrueMyth.lua
          sha256sum TrueMyth.lua "$zip_name" > SHA256SUMS
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          # shellcheck disable=SC2086
          gh release create "$TAG" TrueMyth.lua "$zip_name" SHA256SUMS $prerelease \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag
