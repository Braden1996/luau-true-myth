name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag ancestry and source version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          grep -Fq "version = \"${TAG#v}\"" packages/libraries/luau/pure/true-myth/src/TrueMyth.luau
      - uses: Braden1996/sergeant-releases/actions/setup@v0.15.0
        with:
          seal-sysctl: "true"
      - uses: Braden1996/sergeant-releases/actions/setup-luau@v0.15.0
        with:
          luau-ast: "true"
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        env:
          MISE_DISABLE_TOOLS: http:sgt,http:woof
        with:
          cache: false
      - run: lune setup
      - name: Fetch pinned Sergeant npm tarballs
        run: |
          mkdir -p ../sergeant/dist/npm
          npm pack --pack-destination ../sergeant/dist/npm @sgt-build/tsconfig@0.15.0 @sgt-build/oxlint-config@0.15.0
      - uses: Braden1996/sergeant-releases/actions/ci@v0.15.0

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Braden1996/sergeant-releases/actions/setup-luau@v0.15.0
      - uses: Braden1996/sergeant-releases/actions/release-woof@v0.15.0
        with:
          extra-artifacts: dist/TrueMyth.lua
