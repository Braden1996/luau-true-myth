# Publishes a release when a `v*.*.*` tag is pushed. The tagged commit is re-verified with the full `moon run :check`
# from a cold start (no tool or moon cache, so nothing a pull request wrote can reach a release), the tag must match
# the library's `version`, then the Lua 5.1 bundle and a source archive are attached with checksums.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: false
      - name: gate
        env:
          MOON_CACHE: write
        run: mise exec -- moon run :check
      - name: version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! grep -q "version = \"${TAG#v}\"" src/TrueMyth.luau; then
            echo "::error file=src/TrueMyth.luau::version is not ${TAG#v}"
            exit 1
          fi
      - name: release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The CHANGELOG.md section for this version, without its heading.
          awk -v v="${TAG#v}" 'index($0, "## [" v "]") == 1 {on=1; next} /^## / && on {exit} on && !/^\[.*\]: http/' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "::error file=CHANGELOG.md::no section for ${TAG#v}"; exit 1; fi
          cat notes.md
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          name="luau-true-myth-${TAG#v}"
          mkdir -p "$name"
          cp -r src LICENSE README.md CHANGELOG.md "$name/"
          rm -f "$name/src/moon.yml"
          zip -qr "$name.zip" "$name"
          cp dist/TrueMyth.lua TrueMyth.lua
          sha256sum TrueMyth.lua "$name.zip" > SHA256SUMS
          gh release create "$TAG" TrueMyth.lua "$name.zip" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag
