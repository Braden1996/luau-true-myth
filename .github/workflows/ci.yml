# The required gate. `ci-ok` is the one status check the branch ruleset requires (with `pr-title`).
# `check` runs Sergeant (`sgt doctor`, `sgt check`, `sgt test` on LuaJIT) plus bundle specs, type fixtures, and docs site checks.
name: ci

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: true
      - name: install luajit and enable sealing
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends luajit
      - name: setup lune typedefs and install dependencies
        run: |
          mise exec -- lune setup
          mise exec -- sgt --no-daemon install --frozen
          mise exec -- bun install --cwd site --frozen-lockfile
      - name: gate
        run: |
          mise exec -- sgt --no-daemon doctor
          mise exec -- sgt --no-daemon check
          mise exec -- sgt --no-daemon test
          mise exec -- sgt --no-daemon run scripts-typecheck
          mise exec -- sgt --no-daemon run build-fresh
          mise exec -- sgt --no-daemon run bundle-specs
          mise exec -- sgt --no-daemon run fixtures
          mise exec -- sgt --no-daemon run site-check

  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          min-severity: low
          advanced-security: false
          annotations: true

  ci-ok:
    if: always()
    needs: [check, zizmor]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: all required jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - name: ok
        run: echo "sgt gate and zizmor passed"
