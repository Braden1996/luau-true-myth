name: ci

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-ok:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Braden1996/sergeant-releases/actions/setup@v0.15.0
        with:
          seal-sysctl: "true"
      - uses: Braden1996/sergeant-releases/actions/setup-luau@v0.15.0
        with:
          luau-ast: "true"
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        env:
          MISE_DISABLE_TOOLS: http:sgt,http:woof
        with:
          cache: false
      - run: lune setup
      - name: Fetch pinned Sergeant npm tarballs
        run: |
          mkdir -p ../sergeant/dist/npm
          npm pack --pack-destination ../sergeant/dist/npm @sgt-build/tsconfig@0.15.0 @sgt-build/oxlint-config@0.15.0
      - uses: Braden1996/sergeant-releases/actions/ci@v0.15.0
