name: Bug or wrong type
description: Something behaves differently from its documentation, or a correct program gets a type error (or a wrong one does not).
labels: [bug]
body:
  - type: textarea
    id: code
    attributes:
      label: Smallest code that shows it
      description: "A --!strict snippet. Say whether it runs in Lune, in WoW (dist/TrueMyth.lua), or both."
      render: luau
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happens (luau-lsp output or runtime error)
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: luau-true-myth version and luau-lsp version
      placeholder: v0.1.0, luau-lsp 1.70.1
    validations:
      required: true
