$schema: "../.moon/cache/schemas/project.json"

# Project `tests`: the runtime specs (against the Luau sources and the Lua 5.1 bundle) and the type fixtures.
layer: "automation"
tags: ["luau"]

taskOptions:
  shell: false
  runFromWorkspaceRoot: true

tasks:
  spec:
    description: "Every spec passes against src/ (Luau) and dist/TrueMyth.lua (Lua 5.1 only), covering every function"
    command: "lune"
    args: ["run", "scripts/test"]
    deps: ["lib:build-fresh"]
    options:
      cache: false
  fixtures:
    description: "tests/pass type-checks clean; tests/fail gets exactly its .expected diagnostics (new solver)"
    command: "lune"
    args: ["run", "scripts/fixtures"]
    deps: ["lib:lune-types"]
    options:
      cache: false
  check:
    description: "Aggregator: every test"
    deps: ["~:spec", "~:fixtures"]
